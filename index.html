function leaderNav(){

async function deterministicStudentEmail(code){
 const data=new TextEncoder().encode(code.trim().toLowerCase());
 const hash=await crypto.subtle.digest("SHA-256",data);
 const hex=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
 return `${hex}@students.abbasia-sunday-crew.firebaseapp.com`;
}

async function grantPoints(id){
 const s=sharedData("students").find(x=>x.id===id);if(!s)return;
 openModal(`⭐ ${esc(s.name)}`,`<form onsubmit="applyPoints(event,'${id}')" class="space-y-3"><input id="pointsDelta" type="number" class="input" placeholder="+10 أو -10" required><input id="pointsReason" class="input" placeholder="${L().reason}" required><button class="btn btn-primary w-full">${L().save}</button></form>`);
}
window.grantPoints=grantPoints;
async function applyPoints(e,id){
 e.preventDefault();const delta=Number(pointsDelta.value),reason=pointsReason.value,s=sharedData("students").find(x=>x.id===id),before=s.points||0,after=Math.max(0,before+delta);
 if(state.demo){s.points=after;state.local.student.id===id&&(state.local.student.points=after);state.local.history.unshift({id:crypto.randomUUID(),delta,before,after,reason});closeModal();render();toast(`تم تحديث النقاط ${delta>0?"+":""}${delta} ⭐`,"ok");return}
 await runTransaction(db,async tx=>{const ref=doc(db,"students",id);const snap=await tx.get(ref);const b=snap.data()?.points||0;tx.update(ref,{points:Math.max(0,b+delta)});tx.set(doc(collection(db,"pointHistory")),{studentId:id,delta,before:b,after:Math.max(0,b+delta),reason,createdBy:state.user.uid,createdAt:serverTimestamp()})});closeModal();toast("تم تحديث النقاط","ok")
}
window.applyPoints=applyPoints;

async function assignTeam(id,team){if(state.demo){const s=state.local.students.find(x=>x.id===id);if(s)s.team=team;render();toast("اتغير الفريق 🏆","ok");return}await fsUpdate("students",id,{team});await fsUpdate("publicStudents",id,{team});toast("اتغير الفريق 🏆","ok")}
window.assignTeam=assignTeam;
async function saveAttendance(){
 const rows=[...document.querySelectorAll("[data-att]")];for(const row of rows){const status=row.value,id=row.dataset.att,s=sharedData("students").find(x=>x.id===id);if(state.demo){state.local.attendance.push({studentId:id,date:new Date().toISOString().slice(0,10),status});if(status==="present")s.points=(s.points||0)+10;else if(status==="late")s.points=(s.points||0)+5}}
 if(!state.demo){const batch=writeBatch(db),date=new Date().toISOString().slice(0,10);rows.forEach(r=>batch.set(doc(collection(db,"attendanceLogs")),{studentId:r.dataset.att,date,status:r.value,createdAt:serverTimestamp(),createdBy:state.user.uid}));await batch.commit()}
 render();toast("الحضور اتسجل! 📋","ok")
}
window.saveAttendance=saveAttendance;

async function approveSubmission(type,id,points){
 if(state.demo){const arr=type==="QT"?state.local.qtSubmissions:state.local.memorySubmissions,x=arr.find(a=>a.id===id);if(x){x.status="approved";const s=state.local.students.find(a=>a.id===x.studentId)||state.local.student;s.points=(s.points||0)+points;state.local.history.unshift({id:crypto.randomUUID(),delta:points,before:s.points-points,after:s.points,reason:type==="QT"?"Quiet Time":"Memory"});}state.data.qtSubmissions=state.local.qtSubmissions;state.data.memorySubmissions=state.local.memorySubmissions;render();toast("تم الاعتماد وإضافة النقاط 🎉","ok");return}
 const col=type==="QT"?"qtSubmissions":"memorySubmissions";const sub=await getDoc(doc(db,col,id));if(!sub.exists())return;const d=sub.data();await runTransaction(db,async tx=>{const sr=doc(db,"students",d.studentId),ss=await tx.get(sr),before=ss.data()?.points||0;tx.update(sr,{points:increment(points)});tx.update(doc(db,col,id),{status:"approved",approvedAt:serverTimestamp(),approvedBy:state.user.uid});tx.set(doc(collection(db,"pointHistory")),{studentId:d.studentId,delta:points,before,after:before+points,reason:type==="QT"?"Quiet Time approved":"Memory approved",createdBy:state.user.uid,createdAt:serverTimestamp()});tx.set(doc(collection(db,"notifications")),{recipientId:d.studentId,title:type==="QT"?"🎉 QT Approved!":"🎉 Memory Approved!",body:`+${points} points`,read:false,createdAt:serverTimestamp()})});toast("تم الاعتماد 🎉","ok")
}
window.approveSubmission=approveSubmission;
async function rejectSubmission(type,id){if(state.demo){const arr=type==="QT"?state.local.qtSubmissions:state.local.memorySubmissions,x=arr.find(a=>a.id===id);if(x)x.status="rejected";render();toast("تم الرفض","ok");return}await fsUpdate(type==="QT"?"qtSubmissions":"memorySubmissions",id,{status:"rejected",rejectedAt:serverTimestamp(),rejectedBy:state.user.uid});toast("تم الرفض","ok")}
window.rejectSubmission=rejectSubmission;

async function submitChallenge(id){
 const s=currentStudent(),c=sharedData("challenges").find(x=>x.id===id),d={studentId:s.id,challengeId:id,status:"pending",points:c.points};
 if(state.demo){state.local.challengeSubmissions.push({id:crypto.randomUUID(),...d});toast("التحدي اتبعت للمراجعة ⚡","ok");return}
 await fsAdd("challengeSubmissions",d);toast("التحدي اتبعت ⚡","ok")
}
window.submitChallenge=submitChallenge;
async function addMemory(){openModal("🧠 "+L().memory,`<form onsubmit="saveMemory(event)" class="space-y-3"><input id="memTitle" class="input" placeholder="${state.lang==="ar"?"العنوان":"Title"}" required><textarea id="memText" class="input" placeholder="${state.lang==="ar"?"الآية":"Verse"}" required></textarea><input id="memRef" class="input" placeholder="Reference" required><input id="memPoints" type="number" class="input" value="40"><button class="btn btn-primary w-full">${L().save}</button></form>`)}
window.addMemory=addMemory;
async function saveMemory(e){e.preventDefault();await localOrFirebase("memoryTasks",{title:memTitle.value,text:memText.value,reference:memRef.value,points:Number(memPoints.value)});closeModal();toast("تم حفظ آية جديدة 🧠","ok")}
async function saveQTSchedule(e){
  e?.preventDefault?.();
  const schedule = {};
  DAYS.forEach(day => {
    const el = document.getElementById(`qt-${day}`);
    if (el) schedule[day] = el.value.trim();
  });
  if (state.demo) {
    state.local.qtSchedule = schedule;
  } else {
    await setDoc(doc(db,"settings","qtSchedule"), { schedule, updatedAt: serverTimestamp(), updatedBy: state.user.uid }, { merge:true });
  }
  toast("تم حفظ جدول الخلوة 📖","ok");
}
window.saveQTSchedule=saveQTSchedule;
async function addChallenge(){openModal("⚡ "+L().challenges,`<form onsubmit="saveChallenge(event)" class="space-y-3"><input id="chTitle" class="input" required placeholder="${state.lang==="ar"?"العنوان":"Title"}><textarea id="chDesc" class="input" required placeholder="${state.lang==="ar"?"الوصف":"Description"}></textarea><input id="chPoints" type="number" class="input" value="100"><button class="btn btn-primary w-full">${L().save}</button></form>`)}
window.addChallenge=addChallenge;
async function saveChallenge(e){e.preventDefault();await localOrFirebase("challenges",{title:chTitle.value,description:chDesc.value,points:Number(chPoints.value),active:true});closeModal();toast("التحدي جاهز ⚡","ok")}
async function addReward(){openModal("🎁 "+L().rewards,`<form onsubmit="saveReward(event)" class="space-y-3"><input id="rwName" class="input" required placeholder="${state.lang==="ar"?"اسم المكافأة":"Reward name"}><textarea id="rwDesc" class="input"></textarea><input id="rwCost" type="number" class="input" value="300"><button class="btn btn-primary w-full">${L().save}</button></form>`)}
window.addReward=addReward;
async function saveReward(e){e.preventDefault();await localOrFirebase("rewards",{name:rwName.value,description:rwDesc.value,cost:Number(rwCost.value),stock:10,active:true});closeModal();toast("المكافأة اتضافت 🎁","ok")}
async function publishPost(e){e.preventDefault();await localOrFirebase("posts",{title:postTitle.value,content:postContent.value,target:"all"});e.target.reset();toast("الإعلان اتنشر 📣","ok")}
window.publishPost=publishPost;
async function addEvent(e){e.preventDefault();await localOrFirebase("events",{title:eventTitle.value,date:eventDate.value,details:eventDetails.value});e.target.reset();toast("الإيفنت اتضاف 📅","ok")}
window.addEvent=addEvent;
async function approveRedemption(id){if(state.demo){const r=state.local.redemptions.find(x=>x.id===id);if(r)r.status="approved";render();toast("تم اعتماد المكافأة 🎁","ok");return}await fsUpdate("rewardRedemptions",id,{status:"approved",approvedAt:serverTimestamp(),approvedBy:state.user.uid});toast("تم اعتماد الطلب","ok")}
window.approveRedemption=approveRedemption;
async function rejectRedemption(id){if(state.demo){const r=state.local.redemptions.find(x=>x.id===id);if(r)r.status="rejected";render();return}await fsUpdate("rewardRedemptions",id,{status:"rejected",rejectedAt:serverTimestamp(),rejectedBy:state.user.uid})}
window.rejectRedemption=rejectRedemption;
async function markNotification(id){const n=sharedData("notifications").find(x=>x.id===id);if(n)n.read=true;if(!state.demo)await fsUpdate("notifications",id,{read:true});render()}
window.markNotification=markNotification;

if(firebaseReady){
 onAuthStateChanged(auth,async user=>{
   if(!user||state.mode)return;
   try{
    const ls=await getDoc(doc(db,"leaders",user.uid));
    if(ls.exists())await loadLeaderSession(user); else await loadStudentSession(user);
   }catch(e){console.warn(e)}
 });
}

/* PWA install prompt */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
window.installApp=async()=>{if(!deferredPrompt){toast("افتح قائمة المتصفح واختار Add to Home Screen 📱");return}deferredPrompt.prompt();deferredPrompt=null};

render();

// Keep the app installable and refresh the shell when a new service worker is deployed.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker:', err));
  });
}
</script>
